# PARA QUE SERVE ESTE ARQUIVO?
# Imagine que você alterou um botão em src/ui.py e fez commit e push.
# O código novo chegou ao GitHub, mas a EC2 ainda está com a cópia antiga.
# Este arquivo ensina o GitHub a entrar na EC2 e atualizar a aplicação.
# Essa atualização da aplicação no servidor é chamada de DEPLOY.
#
# O CAMINHO COMPLETO:
# Seu Windows --git push--> GitHub --você aciona a rotina--> EC2 atualizada.
# O nome dessa rotina no GitHub Actions é WORKFLOW.
#
# EXEMPLO PASSO A PASSO:
# 1. Você faz git push e envia a nova versão ao GitHub.
# 2. Você abre Actions e clica em Run workflow.
# 3. Um computador temporário do GitHub inicia a automação.
# 4. Ele usa SSH para entrar na EC2 da aplicação.
# 5. Na EC2, git pull baixa o código novo e systemctl reinicia o Streamlit.
# 6. Você abre a aplicação atualizada no navegador.
#
# ONDE ENTRAM CI E CD?
# CI = integração contínua: integrar mudanças e verificá-las com testes.
# CD = entrega ou implantação contínua: preparar/publicar novas versões.
# Aqui temos uma rotina de deploy acionada manualmente, sem testes de CI.
# Fazer push, sozinho, NÃO inicia esta rotina.

# 1. QUAL NOME VOCÊ VÊ NO GITHUB?
# Este título aparece na aba Actions do seu repositório.
name: Enterprise Manual Deploy

# 2. QUANDO O GITHUB DEVE COMEÇAR?
# on significa: "inicie quando acontecer o evento indicado abaixo".
on:
  # workflow_dispatch permite que você clique em Run workflow para iniciar.
  workflow_dispatch:
    # inputs são os campos do formulário mostrado antes da execução.
    inputs:
      # Este campo recebe o nome de um Environment cadastrado no GitHub.
      # Pense nele como uma pasta de configurações do destino de deploy.
      environment:
        # Texto que identifica o campo no formulário: "Ambiente de destino".
        description: 'Target Environment'
        # true = o campo é obrigatório.
        required: true
        # Valor que já aparece preenchido; você pode alterá-lo no formulário.
        default: 'FDE-YT-Cold'

# 3. QUAL TRABALHO SERÁ FEITO, E EM QUAL COMPUTADOR?
# jobs contém os trabalhos da rotina. Este arquivo tem apenas um trabalho.
jobs:
  # deploy é o nome interno escolhido para esse trabalho.
  deploy:
    # O GitHub fornece um computador temporário com Ubuntu: o RUNNER.
    # Ele executa a automação e, mais adiante, conecta à sua EC2 por SSH.
    # Esse computador é separado do seu Windows e das suas duas EC2.
    runs-on: ubuntu-latest
    # Leia ${{ inputs.environment }} como: "use o valor do formulário".
    # Exemplo: se você deixou FDE-YT-Cold, o job usa esse Environment.
    # Ele pode guardar secrets (credenciais) e regras de aprovação.
    # Environment do GitHub, arquivo .env e venv Python são coisas diferentes.
    environment: ${{ inputs.environment }}
    # steps = passos desse trabalho, executados na ordem em que aparecem.
    steps:
      # 4. PRIMEIRO PASSO: OBTER UMA CÓPIA DO REPOSITÓRIO NO RUNNER.
      # name é apenas o título do passo, mostrado durante a execução.
      - name: Checkout Repository
        # uses significa: "execute esta ferramenta pronta" (uma ACTION).
        # actions/checkout obtém o repositório; @v4 escolhe a versão da ferramenta.
        # Essa cópia fica no runner. O git pull abaixo atualizará a cópia da EC2.
        uses: actions/checkout@v4

      # 5. SEGUNDO PASSO: ENTRAR NA EC2 DA APLICAÇÃO POR SSH.
      - name: Deploy to EC2 via SSH
        # Esta ferramenta faz a conexão SSH e executa os comandos na EC2.
        # É semelhante a você entrar por SSH e digitar os comandos no terminal.
        uses: appleboy/ssh-action@v1.0.3
        # with contém as informações necessárias para essa conexão.
        with:
          # PARA ONDE conectar? IP ou DNS da EC2 nova, onde roda o Streamlit.
          # Leia ${{ secrets.EC2_HOST }} como: "busque o segredo EC2_HOST".
          # Você cadastra esses secrets no GitHub; não escreve seus valores aqui.
          host: ${{ secrets.EC2_HOST }}
          # COM QUAL USUÁRIO? No seu caso, normalmente ubuntu.
          username: ${{ secrets.EC2_USER }}
          # COM QUAL CHAVE? O secret guarda o CONTEÚDO completo da chave privada.
          # Exemplo: conteúdo do linux test.pem, não o caminho dele no Windows.
          # Essa chave permite entrar no servidor; não é uma senha do SQL Server.
          key: ${{ secrets.EC2_SSH_KEY }}
          # 6. JÁ DENTRO DA EC2: EXECUTAR OS COMANDOS DE ATUALIZAÇÃO.
          # script é a sequência de comandos. O | permite escrever várias linhas.
          script: |
            # Entra na pasta do projeto, que já deve existir na EC2.
            cd /home/ubuntu/cold-chain-logistics-FDE-Project

            # Traz as atualizações de main do repositório remoto chamado origin.
            # É aqui que a EC2 recebe o código que você enviou com git push.
            # Mantenha a cópia da EC2 na branch main: pull não troca de branch.
            git pull origin main

            # Ativa o ambiente Python já criado, somente nesta sessão de terminal.
            # É o mesmo comando que faz aparecer (venv) no seu terminal SSH.
            source venv/bin/activate

            # Pede ao gerenciador de serviços do Linux (systemd) que reinicie
            # o serviço chamado streamlit para carregar a versão atualizada.
            # O serviço precisa ter sido criado antes em streamlit.service.
            # O Python usado pelo serviço é definido nesse arquivo de serviço;
            # não depende da ativação do venv na linha anterior.
            sudo systemctl restart streamlit

# O QUE PRECISA ESTAR PRONTO PARA ESTA ROTINA FUNCIONAR?
# - Secrets EC2_HOST, EC2_USER e EC2_SSH_KEY cadastrados no GitHub.
# - Acesso SSH do runner à EC2. Liberar só seu IP pessoal não libera o runner.
# - Repositório, venv, dependências e .env já preparados na EC2.
# - Serviço streamlit instalado e permissão para reiniciá-lo com sudo sem senha.
#
# LIMITES DESTE ARQUIVO:
# - Não executa pip install: bibliotecas novas precisam ser instaladas à parte.
# - Não testa se a aplicação funciona depois de reiniciar.
# - Não configura parada imediata em falhas intermediárias (set -e).
# - Sempre pede origin main, mesmo se você escolher outra branch no formulário.
# - O checkout inicial não é usado diretamente pelos comandos remotos.
#
# Referências para estudar depois:
# https://docs.github.com/en/actions/reference/workflows-and-actions/workflow-syntax
# https://github.com/actions/checkout/tree/v4
# https://github.com/appleboy/ssh-action/tree/v1.0.3
