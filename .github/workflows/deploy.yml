# Push na main inicia o deploy; Run workflow também fica disponível.
# Configure a role OIDC antes do primeiro push: docs/guia-deploy-automatico.md.
name: Deploy EC2 App

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

# Uma execução por vez; a anterior termina a limpeza antes da próxima.
concurrency:
  group: deploy-vm-app
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: FDE-YT-COLD
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      AWS_REGION: us-east-2
      AWS_PAGER: ''
      AWS_RETRY_MODE: standard
      AWS_MAX_ATTEMPTS: '3'
      EC2_SECURITY_GROUP_ID: sg-0f4e7a8c276c7f2b2
      RULE_DESCRIPTION: github-actions:${{ github.repository_id }}:${{ github.run_id }}:${{ github.run_attempt }}

    steps:
      - name: Check deployment configuration
        env:
          AWS_ROLE_ARN: ${{ secrets.AWS_ROLE_ARN }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -euo pipefail
          for variable in AWS_ROLE_ARN EC2_HOST EC2_USER EC2_SSH_KEY; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Configure o secret $variable no ambiente FDE-YT-COLD."
              exit 1
            fi
          done

      # Credenciais temporárias da AWS, sem access key permanente.
      - name: Authenticate to AWS with OIDC
        id: aws
        uses: aws-actions/configure-aws-credentials@v6.3.1
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '464453619990'
          role-session-name: GitHubDeploy-${{ github.run_id }}
          role-duration-seconds: 3600

      - name: Identify runner IPv4
        id: runner
        run: |
          set -euo pipefail
          runner_ip=$(curl -4 --fail --silent --show-error --max-time 10 --retry 2 https://checkip.amazonaws.com)
          python3 -c 'import ipaddress, sys; ipaddress.IPv4Address(sys.argv[1])' "$runner_ip"
          echo "cidr=$runner_ip/32" >> "$GITHUB_OUTPUT"

      # Libera só TCP/22 do IPv4 deste runner; preserva as regras do seu PC.
      - name: Allow temporary SSH access
        env:
          RUNNER_CIDR: ${{ steps.runner.outputs.cidr }}
        run: |
          set -euo pipefail
          permissions=$(jq -cn --arg cidr "$RUNNER_CIDR" --arg description "$RULE_DESCRIPTION" \
            '[{IpProtocol:"tcp",FromPort:22,ToPort:22,IpRanges:[{CidrIp:$cidr,Description:$description}]}]')
          aws ec2 authorize-security-group-ingress \
            --group-id "$EC2_SECURITY_GROUP_ID" \
            --ip-permissions "$permissions" > /dev/null

      - name: Wait for SSH connectivity
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          python3 - <<'PY'
          import os
          import socket
          import time

          for attempt in range(12):
              try:
                  with socket.create_connection((os.environ["EC2_HOST"], 22), timeout=5):
                      break
              except OSError:
                  if attempt == 11:
                      raise SystemExit("SSH indisponível: confira EC2_HOST, estado da VM e security group.")
                  time.sleep(5)
          PY

      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DEPLOY_SHA: ${{ github.sha }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DEPLOY_SHA
          command_timeout: 10m
          script: |
            set -eu
            cd /home/ubuntu/cold-chain-logistics-FDE-Project

            # Exige main sem alterações locais rastreadas; não apaga trabalho na VM.
            test "$(git branch --show-current)" = main
            git diff --quiet
            git diff --cached --quiet
            git fetch origin main
            git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
            git merge --ff-only "$DEPLOY_SHA"
            test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

            # O serviço já aponta para o Python do venv.
            sudo -n systemctl restart streamlit
            curl --fail --silent --show-error --retry 12 --retry-delay 5 \
              --retry-connrefused --connect-timeout 3 --max-time 5 \
              http://127.0.0.1:8501/_stcore/health
            sudo -n systemctl is-active --quiet streamlit
            echo "Deploy concluído: $DEPLOY_SHA"

      # Executa também quando o deploy falha. Busca pela descrição exclusiva,
      # mesmo se a resposta de criação da regra tiver se perdido na rede.
      - name: Remove temporary SSH access
        if: ${{ always() && steps.aws.outcome == 'success' && steps.runner.outcome == 'success' }}
        timeout-minutes: 3
        env:
          RUNNER_CIDR: ${{ steps.runner.outputs.cidr }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4; do
            rules=$(aws ec2 describe-security-group-rules \
              --filters "Name=group-id,Values=$EC2_SECURITY_GROUP_ID" --output json)
            rule_ids=$(jq -r --arg description "$RULE_DESCRIPTION" --arg cidr "$RUNNER_CIDR" \
              '.SecurityGroupRules[] | select(.Description == $description and .CidrIpv4 == $cidr
                and .IsEgress == false and .IpProtocol == "tcp" and .FromPort == 22 and .ToPort == 22)
                | .SecurityGroupRuleId' <<< "$rules")
            if [[ -z "$rule_ids" ]]; then
              # Repete a leitura para tolerar a consistência eventual da API.
              if [[ "$attempt" -ge 2 ]]; then
                echo 'Nenhuma regra SSH desta execução permanece no grupo.'
                exit 0
              fi
            else
              while IFS= read -r rule_id; do
                if ! result=$(aws ec2 revoke-security-group-ingress \
                  --group-id "$EC2_SECURITY_GROUP_ID" \
                  --security-group-rule-ids "$rule_id" 2>&1); then
                  # Uma leitura defasada pode devolver uma regra já removida.
                  if [[ "$result" != *InvalidSecurityGroupRuleId.NotFound* ]]; then
                    echo "$result" >&2
                    exit 1
                  fi
                fi
              done <<< "$rule_ids"
            fi
            sleep 5
          done
          echo "::error::Confira e remova a regra com descrição $RULE_DESCRIPTION no grupo $EC2_SECURITY_GROUP_ID."
          exit 1
